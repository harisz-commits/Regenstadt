<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070a12'/%3E%3Crect x='7' y='2' width='2' height='12' fill='%232ee6ff'/%3E%3C/svg%3E" />
    <title>REGENSTADT</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04060b;
        overflow: hidden;
        color: #9fb4cc;
        font-family: ui-monospace, "SFMono-Regular", "IBM Plex Mono", Menlo, monospace;
      }
      #stage { position: fixed; inset: 0; }
      #gl { display: block; width: 100%; height: 100%; }
      #fatal {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center;
        text-align: center; padding: 24px; font-size: 13px; line-height: 1.8;
      }
      #boot {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background: #04060b; transition: opacity .9s ease;
        letter-spacing: .28em; font-size: 11px; color: #2ee6ff;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="gl"></canvas></div>
    <div id="boot">REGENSTADT</div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
